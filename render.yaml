services:
  - type: web
    name: gramin-api
    runtime: docker
    plan: free
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gramin-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_MINUTES
        value: "10080"
databases:
  - name: gramin-db
    plan: free
    databaseName: gramin
    user: gramin
