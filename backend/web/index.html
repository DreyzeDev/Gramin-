<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Gramin</title>
  <link rel="icon" href="/app-assets/welcome.png">
  <script src="/app-assets/version-loader.js"></script>
  <style>
    .update-sheet[hidden]{display:none!important}.update-sheet{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.28);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:update-veil .2s ease}.update-panel{width:min(100%,520px);padding:10px 20px max(20px,env(safe-area-inset-bottom));border-radius:28px 28px 0 0;background:#fff;color:#111;box-shadow:0 -18px 60px rgba(0,0,0,.15);animation:update-rise .35s cubic-bezier(.22,1,.36,1)}.update-handle{width:38px;height:4px;margin:0 auto 18px;border-radius:4px;background:#d5d5d5}.update-kicker{font-size:11px;font-weight:800;letter-spacing:1.5px;color:#767676;text-transform:uppercase}.update-panel h3{margin:6px 0 5px;font-size:25px;letter-spacing:-.5px}.update-version{margin:0;color:#767676;font-size:13px}.update-notes{display:grid;gap:10px;margin:20px 0;padding:0;list-style:none}.update-notes li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.35}.update-notes li::before{content:"✓";display:grid;place-items:center;flex:0 0 23px;height:23px;border-radius:50%;background:#111;color:#fff;font-size:12px;font-weight:900}.update-actions{display:grid;grid-template-columns:1fr 1.5fr;gap:10px}.update-actions button{border:0;border-radius:16px;padding:15px;font:750 15px inherit}.update-later{background:#eee;color:#111}.update-now{background:#111;color:#fff}@keyframes update-rise{from{transform:translateY(100%)}}@keyframes update-veil{from{opacity:0}}@media(prefers-color-scheme:dark){.update-panel{background:#181818;color:#f7f7f7}.update-version,.update-kicker{color:#aaa}.update-handle{background:#444}.update-later{background:#2b2b2b;color:#fff}.update-now{background:#f7f7f7;color:#111}.update-notes li::before{background:#f7f7f7;color:#111}}@media(prefers-reduced-motion:reduce){.update-sheet,.update-panel{animation:none}}
  </style>
</head>
<body>
  <div id="boot" class="boot"><div class="mark">G</div><span>Gramin</span></div>

  <main id="auth" class="auth hidden">
    <section class="auth-card">
      <img src="/app-assets/welcome.png" alt="" class="welcome-art">
      <h1>Gramin</h1>
      <p class="muted">Ваши финансы. Только проще.</p>
      <div class="segmented">
        <button class="segment active" data-auth-mode="login">Войти</button>
        <button class="segment" data-auth-mode="register">Регистрация</button>
      </div>

      <form id="login-form" class="stack">
        <label>Имя пользователя<input name="username" autocomplete="username" placeholder="@username" required minlength="4"></label>
        <label>Пароль<input name="password" type="password" autocomplete="current-password" placeholder="Минимум 8 символов" required minlength="8"></label>
        <button class="primary" type="submit">Войти в Gramin</button>
      </form>

      <form id="register-form" class="stack hidden">
        <div class="pair">
          <label>Имя<input name="first_name" autocomplete="given-name" required minlength="2"></label>
          <label>Фамилия<input name="last_name" autocomplete="family-name" required minlength="2"></label>
        </div>
        <label>Имя пользователя<input name="username" autocomplete="username" placeholder="@username" required minlength="4"></label>
        <label>Дата рождения<input name="birth_date" type="date" required></label>
        <label>Пароль<input name="password" type="password" autocomplete="new-password" placeholder="Минимум 8 символов" required minlength="8"></label>
        <button class="primary" type="submit">Создать демо-счёт</button>
      </form>
      <small>Только виртуальные деньги</small>
    </section>
  </main>

  <div id="shell" class="shell hidden">
    <header class="topbar">
      <div><span class="eyebrow">GRAMIN</span><h2 id="page-title">Главная</h2></div>
      <button id="refresh" class="icon-button" aria-label="Обновить"><span data-icon="refresh"></span></button>
    </header>

    <div id="content" class="content">
      <section id="view-home" class="view active">
        <div class="hero card home-overview">
          <div class="home-overview-balance">
            <span class="muted">Общий баланс</span>
            <strong id="total-balance" class="big-money">0,00 ₼</strong>
          </div>
          <section id="home-card-control" class="home-card-control" aria-label="Управление картой"></section>
          <div id="wallets" class="wallet-strip"></div>
        </div>
        <div class="quick-actions">
          <button data-action="transfer"><b><span data-icon="send"></span></b><span>Перевести</span></button>
          <button data-action="topup"><b><span data-icon="plus"></span></b><span>Пополнить</span></button>
          <button data-action="exchange"><b><span data-icon="repeat"></span></b><span>Обменять</span></button>
        </div>
        <div class="section-heading"><h3>Последние операции</h3></div>
        <div id="transactions" class="list"></div>
      </section>

      <section id="view-cards" class="view">
        <div id="cards" class="cards-stack"></div>
        <button id="create-card" class="primary" data-action="create-card">Выпустить карту</button>
      </section>

      <section id="view-payments" class="view">
        <div id="services" class="service-grid"></div>
      </section>

      <section id="view-analytics" class="view">
        <div class="segmented" id="periods">
          <button class="segment" data-period="week">Неделя</button>
          <button class="segment active" data-period="month">Месяц</button>
          <button class="segment" data-period="year">Год</button>
        </div>
        <div class="card analytics-total"><span class="muted">Расходы</span><strong id="analytics-total">0,00 ₼</strong></div>
        <div class="card"><h3>По категориям</h3><div id="categories" class="bars"></div></div>
        <div class="card"><h3>По дням</h3><div id="daily" class="bars"></div></div>
      </section>

      <section id="view-profile" class="view">
        <div class="profile card">
          <div id="avatar" class="avatar">G</div>
          <div><h3 id="profile-name">Gramin</h3><span id="profile-username" class="muted"></span></div>
        </div>
        <div class="settings card">
          <label class="switch-row"><span>Тёмная тема</span><input id="dark-mode" type="checkbox"></label>
          <div class="row"><span>Версия интерфейса</span><b>Web 1.0</b></div>
          <div class="row"><span>Режим</span><b>Виртуальные деньги</b></div>
        </div>
        <button id="logout" class="secondary danger">Выйти из аккаунта</button>
      </section>
    </div>

    <nav class="tabbar">
      <button class="active" data-view="home"><b><span data-icon="home"></span></b><span>Главная</span></button>
      <button data-view="cards"><b><span data-icon="card"></span></b><span>Карты</span></button>
      <button data-view="payments"><b><span data-icon="grid"></span></b><span>Платежи</span></button>
      <button data-view="analytics"><b><span data-icon="chart"></span></b><span>Аналитика</span></button>
      <button data-view="profile"><b><span data-icon="user"></span></b><span>Профиль</span></button>
    </nav>
  </div>

  <dialog id="modal"><form method="dialog" id="modal-form" class="modal-card"></form></dialog>
  <div id="toast" class="toast hidden"></div>
  <aside id="update-sheet" class="update-sheet" role="dialog" aria-modal="true" aria-labelledby="update-title" hidden>
    <div class="update-panel">
      <div class="update-handle"></div>
      <span class="update-kicker">Доступно обновление</span>
      <h3 id="update-title">Что нового</h3>
      <p id="update-version" class="update-version"></p>
      <ul id="update-notes" class="update-notes"></ul>
      <div class="update-actions">
        <button id="update-later" class="update-later" type="button">Позже</button>
        <button id="update-now" class="update-now" type="button">Обновить</button>
      </div>
    </div>
  </aside>
  <script src="/app-assets/update-controller.js" defer></script>
</body>
</html>
