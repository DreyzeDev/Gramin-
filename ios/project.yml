name: Gramin
options:
  bundleIdPrefix: com.dreyze
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Gramin:
    type: application
    platform: iOS
    sources:
      - path: Gramin
    resources:
      - path: Gramin/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dreyze.gramin
        PRODUCT_NAME: Gramin
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Gramin
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_NSFaceIDUsageDescription: Gramin uses Face ID to protect your demo account.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Choose a profile picture for your Gramin demo account.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: true
    scheme:
      testTargets: []

