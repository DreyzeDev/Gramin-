name: Build unsigned IPA
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/build-unsigned-ipa.yml"
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build without Apple signing
        working-directory: ios
        run: |
          xcodebuild \
            -project Gramin.xcodeproj \
            -scheme Gramin \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Gramin.app Payload/
          zip -r Gramin-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Gramin-unsigned-IPA
          path: ios/Gramin-unsigned.ipa
          retention-days: 14
      - name: Publish IPA in GitHub Releases
        working-directory: ios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*MARKETING_VERSION: *"\([^"]*\)".*/\1/p' project.yml)
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Gramin-unsigned.ipa --clobber
          else
            gh release create "$TAG" Gramin-unsigned.ipa \
              --title "Gramin ${VERSION}" \
              --notes "Unsigned iOS build. Sign it with your Apple ID using AltStore or Sideloadly, then install it over the previous version."
          fi
