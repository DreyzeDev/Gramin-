name: Build unsigned IPA
on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/build-unsigned-ipa.yml"
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build without Apple signing
        working-directory: ios
        run: |
          xcodebuild \
            -project Gramin.xcodeproj \
            -scheme Gramin \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Gramin.app Payload/
          zip -r Gramin-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Gramin-unsigned-IPA
          path: ios/Gramin-unsigned.ipa
          retention-days: 14
